*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

.app{display:grid;grid-template-columns:minmax(320px,38%) 1fr;gap:24px;padding:24px;min-height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.04em;font-size:22px}

.tools{display:flex;gap:8px;flex-wrap:wrap}

@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}

.last{display:flex;gap:10px;flex-wrap:wrap}
.last span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:#262a34;font-variant-numeric:tabular-nums}
.last span:first-child{background:var(--ink);color:#14161C}

.board div.hit{background:var(--ink);color:#14161C}

.right{display:flex;flex-direction:column;gap:20px}
.check{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.res{margin-top:16px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:9}
.modal.show{display:grid}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:380px;text-align:center}
.modal p{margin-bottom:18px;line-height:1.5}
.modal .row{display:flex;gap:10px;justify-content:center}
.danger{background:var(--acc);border-color:var(--acc)}

  $('num').textContent = last ?? '–';
  $('ball').className = 'ball' + (last ? '' : ' idle') + (pop ? ' pop' : '');
  $('out').textContent = drawn.length;
  $('left').textContent = 90 - drawn.length;
  const l = drawn.slice(-6).reverse();
  $('last').innerHTML = l.length ? l.map(n => `<span>${n}</span>`).join('') : '<span style="opacity:.3">–</span>';
  $('draw').disabled = drawn.length >= 90;
  $('draw').textContent = drawn.length >= 90 ? 'No quedan bolas' : 'Sacar bola';
  $('voice').textContent = '🔊 Voz: ' + (voice ? 'sí' : 'no');
  $('voice').classList.toggle('on', voice);
  if ($('cardNo').value) check(false);
}

function say(n){
  if (!voice || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(n < 10 ? `El ${n}` : `El ${n}. ${String(n).split('').join(', ')}`);
    u.lang = 'es-ES'; u.rate = .9;
    speechSynthesis.speak(u);
  }catch(e){}
}

function draw(){
  if (busy || drawn.length >= 90) return;
  busy = true;
  const pool = []; for (let i = 1; i <= 90; i++) if (!drawn.includes(i)) pool.push(i);
  const n = pool[rand(pool.length)];
  const ball = $('ball'); ball.className = 'ball spin';
  let t = 0;
  const iv = setInterval(() => { $('num').textContent = pool[rand(pool.length)]; if (++t > 10) {
    clearInterval(iv); drawn.push(n); save(); render(true); say(n); busy = false; } }, 70);
}

function check(scroll){
  const no = parseInt($('cardNo').value, 10);
  const res = $('res');
  if (!no || no < 1 || no > CARDS.length) { res.innerHTML = `<div class="verdict no">Ese cartón no existe (hay del 1 al ${CARDS.length}).</div>`; return; }
  const g = CARDS[no - 1];
  let html = '<div class="card">';
  const rowHits = [0,0,0];
  g.forEach((row, r) => row.forEach(v => {
    if (!v) html += '<div class="e"></div>';
    else { const m = drawn.includes(v); if (m) rowHits[r]++; html += `<div class="${m ? 'm' : ''}">${v}</div>`; }
  }));
  html += '</div>';
  const total = rowHits.reduce((a,b)=>a+b,0);
  const lines = rowHits.map((h,i)=> h===5 ? i+1 : 0).filter(Boolean);
  let v;
  if (total === 15) v = `<span class="ok">✔ ¡BINGO VÁLIDO! Cartón Nº ${String(no).padStart(3,'0')} completo.</span>`;
  else if (lines.length) v = `<span class="ok">✔ LÍNEA VÁLIDA en la fila ${lines.join(' y ')}.</span> <span class="no">Lleva ${total}/15 para bingo.</span>`;
  else v = `<span class="no">✘ Sin línea ni bingo todavía. Aciertos: ${total}/15 · por filas ${rowHits.join(' · ')} (de 5).</span>`;
  if (STAFF.includes(no)) v = `<span class="no">⚠ Cartón Nº ${String(no).padStart(3,'0')} es de la ORGANIZACIÓN: no opta a premio. Se sigue jugando.</span><br>` + v;
  res.innerHTML = html + `<div class="verdict">${v}</div>`;
}

$('draw').onclick = draw;
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { e.preventDefault(); draw(); } });
$('checkForm').addEventListener('submit', e => { e.preventDefault(); check(true); });
$('voice').onclick = () => { voice = !voice; save(); render(false); if (voice) say(drawn[drawn.length-1] || 1); };
$('full').onclick = () => { try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
$('undo').onclick = () => { if (drawn.length) { drawn.pop(); save(); render(false); } };
$('reset').onclick = () => $('modal').classList.add('show');
$('cancel').onclick = () => $('modal').classList.remove('show');
$('confirm').onclick = () => { drawn = []; save(); $('modal').classList.remove('show'); $('cardNo').value=''; $('res').innerHTML=''; render(false); };

load(); render(false);
</script>
</body>
</html>
